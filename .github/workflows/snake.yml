
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SuyogJamdar
          outputs: |
            dist/github-snake.svg?color_snake=%2336B7B0&color_dots=%23080B1A,%23242052,%234B3F8A,%238B7CFF,%2336B7B0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2336B7B0

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
